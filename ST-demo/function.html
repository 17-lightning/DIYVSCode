<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>${symbol}分解</title>
    <style>
        .function-link {
            color: #0078d4;
            text-decoration: none;
            cursor: pointer;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        .function-link:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>
    <h2>${symbol}的子函数：</h2>
    ${context}
    
    <script>
        try {
            // 获取VSCODE API对象
            const vscode = acquireVsCodeApi();
            // 使用事件委托提高性能
            document.body.addEventListener('click', event => {
                if (event.target.classList.contains('function-link')) {
                    event.preventDefault();
                    const functionName = event.target.getAttribute('data-function');
                    
                    // 添加点击反馈
                    event.target.style.backgroundColor = '#e0f0ff';
                    setTimeout(() => {
                        event.target.style.backgroundColor = '';
                    }, 300);
                    
                    // 向VSCode插件发送消息
                    vscode.postMessage({
                        command: 'jumpToFunction',
                        functionName: functionName
                    });
                }
            });
        } catch (error) {
            console.error("WebView脚本错误: " + error)
        }
    </script>
</body>
</html>
